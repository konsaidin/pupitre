# Сборка десктопных пакетов (Windows + Linux).
# По тегу v* — публикует файлы в GitHub Release; вручную (workflow_dispatch)
# или по пушу в master — просто складывает артефакты сборки.

name: desktop

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Build desktop
        working-directory: apps/desktop
        # публикуем отдельным шагом ниже, поэтому electron-builder не публикует сам
        run: |
          npm ci
          npm run copy-web
          npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slopsician-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
          generate_release_notes: true
