# Сборка десктопных пакетов (Windows + Linux + macOS: Apple Silicon и Intel с одного раннера).
# В основном репозитории Actions выключены (релизы — tools/release.mjs); macOS собирается в форке или на маке.
# По тегу v* — публикует файлы в GitHub Release; вручную (workflow_dispatch)
# или по пушу в master — просто складывает артефакты сборки.

name: desktop

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build:dsp
          npm test

      # саундфонт синт-минуса гитары (≈ 40 МБ, не в git) + vite build — тем же скриптом, что npm run dev
      - name: Soundfont and web bundle
        run: node apps/desktop/build-web.mjs

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      # Нативный захват (этап 4) кладём только в Linux-сборку — там он проверен
      # e2e. Windows-путь WASAPI не проверялся на железе: сборка остаётся на
      # AudioWorklet-фолбэке, чтобы релиз был гарантированно рабочим.
      - name: Native audio module (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          npm run build:native
          # низколатентный движок гитары (JACK/PipeWire, грузит libjack при открытии)
          npm run build:engine

      # CoreAudio через cpal; аддон под обе архитектуры — пакеты dmg для arm64 и x64 (подпись: build/sign-mac.cjs)
      - name: Native audio module (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          node ../../packages/native-audio/build.mjs --arch arm64
          node ../../packages/native-audio/build.mjs --arch x64

      - name: Build desktop
        working-directory: apps/desktop
        # публикуем отдельным шагом ниже, поэтому electron-builder не публикует сам
        run: |
          npm run copy-web
          npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pupitre-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          generate_release_notes: true
