# Сборка десктопных пакетов (Windows + Linux).
# По тегу v* — публикует файлы в GitHub Release; вручную (workflow_dispatch)
# или по пушу в master — просто складывает артефакты сборки.

name: desktop

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build:dsp
          npm test
          npm run build

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      # Нативный захват (этап 4) кладём только в Linux-сборку — там он проверен
      # e2e. Windows-путь WASAPI не проверялся на железе: сборка остаётся на
      # AudioWorklet-фолбэке, чтобы релиз был гарантированно рабочим.
      - name: Native audio module (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          npm run build:native

      - name: Build desktop
        working-directory: apps/desktop
        # публикуем отдельным шагом ниже, поэтому electron-builder не публикует сам
        run: |
          npm run copy-web
          npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pupitre-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.exe
          generate_release_notes: true
