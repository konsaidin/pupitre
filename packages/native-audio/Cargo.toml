[package]
license = "MIT"
name = "pupitre-native-audio"
version = "0.1.0"
edition = "2021"

[lib]
name = "pupitre_native_audio"
crate-type = ["cdylib"]

[dependencies]
# Для Electron на Windows нужен delay-load хук (N-API-символы резолвятся в
# electron.exe, а не node.exe), но фичи win_delay_load_hook в napi 2.16 НЕТ —
# она ломала резолв зависимостей на всех платформах. Windows-механизм
# (delayload через linker-args или апгрейд napi) — вместе с win-сборкой
# нативного модуля на win-машине; Linux/CI собирают без него.
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
cpal = "0.15"
pupitre-dsp = { path = "../dsp" }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
